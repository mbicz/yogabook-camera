# Yoga Book YB1-X90F: hide the raw atomisp camera from PipeWire.
#
# yb-camerad (systemd user service) owns /dev/video0 and publishes the two
# sensors as "Yoga Book front camera" and "Yoga Book rear camera", with their
# location and with frames rotated to follow the screen. The raw node would
# show only whichever input is selected, unrotated, and GNOME Camera mirrors it
# because it carries no location.
#
# Installed as /usr/share/wireplumber/wireplumber.conf.d/60-yb-camera.conf.
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.name = "v4l2_device.pci-0000_00_03.0"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
